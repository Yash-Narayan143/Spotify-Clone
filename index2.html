<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Navbar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-left">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/26/Spotify_logo_with_text.svg" alt="Spotify Logo" class="logo">
            <div class="nav-item">
                <i class="fas fa-home"></i>
            </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="What do you want to play?" />
                <i class="fas fa-shopping-bag"></i>
            </div>
        </div>

        <div class="navbar-right">
            <button class="premium-btn">Explore Premium</button>
            <div class="nav-item">
                <i class="fas fa-download"></i> Install App
            </div>
            <div class="nav-item">
                <i class="fas fa-bell"></i>
            </div>
            <div class="nav-item user-avatar">
                <span>Y</span>
            </div>
        </div>
    </nav>

</body>
</html>
