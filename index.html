<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-left">
            <img class="invert" src="logo.svg" alt="logo" class="logo">
        </div>
        <div class="navbar-middle">
            <div class="home">
                <button"><img class="invert" src="home.svg" alt="Home"></button>
            </div>
            <div class="searchbar">
                <img class="invert" src="search.svg" alt="">
                <input type="text" placeholder="What do you want to play?">
                <span>|</span>
                <pre>   </pre>
                <img class="invert" src="browse.svg" alt="">
            </div>
        </div>
        <div class="navbar-right">
            <button class="signup-btn">Sign up</button>
            <button class="login-btn">Log in</button>
        </div>
    </nav>
    <div class="container">
        <div class="left-box">
            <div class="close invert">
                <img src="close.svg" alt="">
            </div>
            <div class="library">
                <div class="heading">
                    <div class="library2"><img src="library.svg" alt="" class="invert">
                        <h3>Your Library</h3>
                    </div>
                    <div class="plus"><img src="plus.svg" alt="" class="invert"></div>
                </div>
                <div class="songlist">
                    <ul>
                    </ul>
                </div>
                <div class="footer">
                    <div><a href="https://www.spotify.com/in-en/legal/" id=""><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/in-en/safetyandprivacy/" id=""><span>Safety &amp; Privacy
                                Center</span></a></div>
                    <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/" id=""><span>Privacy
                                Policy</span></a></div>
                    <div><a href="https://www.spotify.com/in-en/legal/cookies-policy/" id=""><span>Cookies</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3" id=""><span>About
                                Ads</span></a></div>
                    <div><a href="https://www.spotify.com/in-en/accessibility/" id=""><span>Accessibility</span></a>
                    </div>
                </div>
            </div>
        </div>
        <div class="right-box">
            <div class="hamburger invert">
                <img src="hamburger.svg" alt="">
            </div>
            <div class="spotifyplaylists">
                <div class="header">
                    <div class="size">Popular artists</div>
                <div class="cardcontainer"></div>
            </div>
            <div class="size">Popular albums</div>
            <div class="cardcontainer1"></div>
        </div>
        <div class="playbar">
            <div class="seekbar">
                <div class="circle"></div>
            </div>
            <div class="abovebar">
                <div class="songinfo"></div>
                <div class="songbtns">
                    <img id="previous" src="previous.svg" alt="">
                    <img id="play" src="play.svg" alt="">
                    <img id="next" src="next.svg" alt="">
                </div>
                <div class="songtime"></div>
            </div>
            <div class="volume">
                <img src="volume.svg" alt="">
                <div class="range">
                    <input type="range" name="volume" id="">
                </div>
            </div>
        </div>
    </div>
    </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
